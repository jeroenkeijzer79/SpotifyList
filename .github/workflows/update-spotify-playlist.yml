name: Update Spotify playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update playlist.json from Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const clientId = process.env.SPOTIFY_CLIENT_ID;
          const clientSecret = process.env.SPOTIFY_CLIENT_SECRET;
          const refreshToken = process.env.SPOTIFY_REFRESH_TOKEN;
          const playlistId = "3vqQjDViyqTRi4PEOsDFi6";

          if (!clientId || !clientSecret || !refreshToken) {
            throw new Error("Spotify secrets ontbreken. Voeg SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET en SPOTIFY_REFRESH_TOKEN toe.");
          }

          const basic = Buffer.from(clientId + ":" + clientSecret).toString("base64");

          async function getAccessToken() {
            const response = await fetch("https://accounts.spotify.com/api/token", {
              method: "POST",
              headers: {
                "Authorization": "Basic " + basic,
                "Content-Type": "application/x-www-form-urlencoded"
              },
              body: new URLSearchParams({
                grant_type: "refresh_token",
                refresh_token: refreshToken
              })
            });

            if (!response.ok) {
              throw new Error("Spotify token refresh mislukt: HTTP " + response.status + " " + await response.text());
            }

            return (await response.json()).access_token;
          }

          async function spotify(path, token) {
            const response = await fetch("https://api.spotify.com/v1/" + path, {
              headers: { "Authorization": "Bearer " + token }
            });

            if (!response.ok) {
              throw new Error("Spotify API fout: HTTP " + response.status + " " + await response.text());
            }

            return response.json();
          }

          (async () => {
            const token = await getAccessToken();
            const playlist = await spotify(
              "playlists/" + playlistId + "?fields=name,id,external_urls,images",
              token
            );

            const tracks = [];
            let offset = 0;

            while (true) {
              const data = await spotify(
                "playlists/" + playlistId +
                "/items?limit=50&offset=" + offset +
                "&fields=items(item(type,name,artists(name),album(images),external_urls)),next,total",
                token
              );

              for (const entry of data.items || []) {
                const track = entry.item;
                if (!track || track.type !== "track") continue;

                tracks.push({
                  title: track.name || "",
                  artists: (track.artists || []).map(a => a.name),
                  image: track.album?.images?.length
                    ? track.album.images[track.album.images.length - 1].url
                    : "",
                  url: track.external_urls?.spotify || ""
                });
              }

              if (!data.next || !data.items?.length) break;
              offset += data.items.length;
            }

            const output = {
              name: playlist.name || "Spotify playlist",
              spotifyPlaylistId: playlist.id,
              spotifyUrl: playlist.external_urls?.spotify || "https://open.spotify.com/playlist/" + playlistId,
              tracks
            };

            fs.writeFileSync("playlist.json", JSON.stringify(output, null, 2) + "\n");
            console.log("Playlist bijgewerkt:", output.name, "-", tracks.length, "tracks");
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git diff --cached --quiet && echo "Geen wijzigingen." && exit 0
          git commit -m "Update Spotify playlist"
          git push
