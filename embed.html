<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpotifyList Embed</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #171717; background: transparent; }
    .track-list { display: grid; gap: 6px; width: 100%; }
    .track {
      display: grid;
      grid-template-columns: 28px 40px minmax(0,1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 7px 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .track-art { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; display: block; }
    .track-number { font-size: 13px; font-weight: 700; opacity: .45; text-align: center; }
    .track-title { margin: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { margin: 2px 0 0; font-size: 11px; opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-link { color: inherit; text-decoration: none; font-size: 11px; opacity: .5; white-space: nowrap; }
    .track-link:hover { opacity: 1; }
    .message { padding: 12px; color: #777; font-size: 13px; }
    @media (max-width: 600px) {
      .track { grid-template-columns: 24px 36px minmax(0,1fr); gap: 8px; padding: 6px 8px; }
      .track-art { width: 36px; height: 36px; }
      .track-title { font-size: 13px; }
      .track-artist { font-size: 10px; }
      .track-link { display: none; }
    }
  </style>
</head>
<body>
  <div id="track-list" class="track-list"></div>
  <script>
    const list = document.getElementById("track-list");
    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[c]));
    fetch("playlist.json?v=1")
      .then(r => { if (!r.ok) throw new Error("playlist.json kon niet worden geladen"); return r.json(); })
      .then(data => {
        const tracks = data.tracks || [];
        if (!tracks.length) {
          list.innerHTML = '<div class="message">Geen nummers beschikbaar.</div>';
          return;
        }
        list.innerHTML = tracks.map((track, i) => {
          const artists = Array.isArray(track.artists) ? track.artists.join(", ") : "";
          const image = track.image ? '<img class="track-art" src="' + esc(track.image) + '" alt="" loading="lazy">' : '<div class="track-art"></div>';
          const link = track.url ? '<a class="track-link" href="' + esc(track.url) + '" target="_blank" rel="noopener">Spotify ↗</a>' : "";
          return '<article class="track"><div class="track-number">' + String(i + 1).padStart(2, "0") + '</div>' + image + '<div><p class="track-title">' + esc(track.title) + '</p><p class="track-artist">' + esc(artists) + '</p></div>' + link + '</article>';
        }).join("");
      })
      .catch(err => list.innerHTML = '<div class="message">' + esc(err.message) + '</div>');
  </script>
</body>
</html>
